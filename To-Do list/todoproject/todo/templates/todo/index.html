<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>
    <h1>My Todo List</h1>

    <!-- Add Task Form -->
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>
                {{ task.title }} 
                {% if task.completed %}
                {% else %}
            </li>
        {% empty %}
            <li>No tasks yet</li>
        {% endfor %}
    </ul>
</body>
</html>
