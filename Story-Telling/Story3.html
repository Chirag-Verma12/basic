    <div class="main box">
        <h1 class="title"><center><u>The Unforgetable Story</h1></center></u>
        <div class="under-head">
            <p><center><u>The Proud Balloon</p></center></u>
        </div>
    </div>
    <div class="content">
       <p> 
        A red balloon floated higher than the others and shouted, “Look how far I’ve gone!”
        A strong wind blew, and the balloon drifted too far and burst on a tree.
        The others, floating gently together, stayed safe and enjoyed the breeze.
     </p>
